name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint-commits:
    name: Lint Commits
    permissions:
      contents: read
    uses: clouatre-labs/.github/.github/workflows/lint-commits.yml@c546e09adb87caef81ae109cb3c27d016bea0fae # reusable lint-commits
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}

  test:
    name: Test
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Syntax check server
        run: node --check server.mjs

      - name: Smoke test MCP stdio handshake
        run: node scripts/smoke.mjs

      - name: Smoke test judge fallback envelope
        run: node scripts/smoke-judge.mjs

      - name: Smoke test HTTP transport handshake
        run: node scripts/smoke-http.mjs

  lint-docs:
    name: Lint Docs
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Lint markdown
        run: npx markdownlint-cli2@0.23.1 '**/*.md' '#.worktrees' '#.handoff'

  ci-result:
    name: CI Result
    runs-on: ubuntu-26.04-arm
    if: always()
    permissions: {}
    needs: [lint-commits, test, lint-docs]
    steps:
      - name: Verify all jobs passed or were skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs passed or were skipped."
