name: publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (pack + checks, skip publish)"
        required: true
        type: boolean
        default: true
      tag_name:
        description: "Existing tag to publish (e.g. v1.0.0); required for workflow_dispatch"
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag-signature:
    name: Verify Tag Signature
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag is signed and points at a release commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          REF_JSON="$(gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}")"
          TAG_TYPE="$(jq -r '.object.type' <<< "$REF_JSON")"
          TAG_SHA="$(jq -r '.object.sha' <<< "$REF_JSON")"

          if [ "$TAG_TYPE" != "tag" ]; then
            echo "::error::${TAG} is a lightweight tag; release tags must be annotated and signed"
            exit 1
          fi

          TAG_OBJ_JSON="$(gh api "repos/${{ github.repository }}/git/tags/${TAG_SHA}")"
          VERIFIED="$(jq -r '.verification.verified' <<< "$TAG_OBJ_JSON")"
          if [ "$VERIFIED" != "true" ]; then
            echo "::error::${TAG} signature not verified"; exit 1
          fi

          # The signed tag object must point at the current main head
          MAIN_SHA="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          COMMIT_SHA="$(jq -r '.object.sha' <<< "$TAG_OBJ_JSON")"
          if [ "$COMMIT_SHA" != "$MAIN_SHA" ]; then
            echo "::error::${TAG} does not point at main HEAD (${MAIN_SHA}); got ${COMMIT_SHA}"
            exit 1
          fi

          echo "Tag ${TAG} verified: signed, annotated, points at main HEAD"

  create-release:
    name: Create Release
    needs: verify-tag-signature
    if: always() && (needs.verify-tag-signature.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Idempotent: skip creation if release already exists; if creation fails with 422
          # (concurrent race), the final view confirms existence and exits 0.
          gh release view "${TAG_NAME}" &>/dev/null \
            || gh release create "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --generate-notes \
            || gh release view "${TAG_NAME}" &>/dev/null

      - name: Dry run - skip release creation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "DRY RUN - GitHub release creation skipped"

  publish:
    name: Publish to npm
    needs: [verify-tag-signature, create-release]
    if: always() && needs.verify-tag-signature.result == 'success' && needs.create-release.result == 'success'
    runs-on: ubuntu-24.04-arm
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in release builds

      - name: Verify package version matches tag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${TAG_NAME}" ]; then
            echo "::error::package version ${PKG_VERSION} does not match tag ${TAG_NAME}"; exit 1
          fi

      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Syntax check server.mjs
        run: node --check server.mjs

      - name: Pack tarball
        run: npm pack

      - name: Publish to npm with provenance
        if: env.DRY_RUN != 'true'
        run: npm publish --provenance --access public decisions-judge-mcp-*.tgz

      - name: Dry run - skip publish
        if: env.DRY_RUN == 'true'
        run: echo "DRY RUN - tarball built and checks passed; publish skipped"
